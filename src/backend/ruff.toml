# Ruff configuration for Python linting
# Documentation: https://docs.astral.sh/ruff/

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.11
target-version = "py311"

[lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "N",   # pep8-naming
    "PL",  # Pylint
    "RUF", # Ruff-specific rules
]

ignore = [
    "E501",   # Line too long (handled by Black)
    "E203",   # Whitespace before ':' (incompatible with Black)
    "W503",   # Line break before binary operator (incompatible with Black)
    "PLR0913", # Too many arguments to function call
    "PLR0912", # Too many branches
    "PLR2004", # Magic value used in comparison
    "N806",   # Variable in function should be lowercase (for API models)
    "N803",   # Argument name should be lowercase (for API models)
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[lint.per-file-ignores]
# Tests can use magic values, assertions, and relative imports
"tests/*" = ["PLR2004", "S101", "TID252"]
# Scripts and migrations can be more flexible
"scripts/*" = ["T201", "S602", "S603"]
"**/migrations/*" = ["T201"]

[lint.isort]
# Sort imports
known-first-party = ["app", "src"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]