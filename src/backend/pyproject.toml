[tool.poetry]
name = "lambda-backend"
version = "0.1.0"
description = "The backend service for the Lambda.hu project."
authors = ["Lambda AI <dev@lambda.hu>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.1"}
sqlalchemy = "^2.0.31"
psycopg2-binary = "^2.9.9"
redis = "^5.0.7"
pydantic = "^2.8.2"
alembic = "^1.13.1"
python-dotenv = "==1.0.0"
celery = "^5.4.0"
requests = "==2.31.0"
beautifulsoup4 = "==4.12.2"
aiohttp = "==3.9.1"
httpx = ">=0.25.2"
chromadb = "*"
anthropic = "^0.34.0"

[tool.poetry.group.dev.dependencies]
pytest = "==7.4.3"
pytest-asyncio = "==0.21.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"  