name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Backend linting and testing
  backend-quality:
    name: Backend Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v3
      with:
        path: src/backend/.venv
        key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      working-directory: src/backend
      run: poetry install --no-interaction --no-root

    - name: Install project
      working-directory: src/backend
      run: poetry install --no-interaction

    - name: Run Ruff linter
      working-directory: src/backend
      run: poetry run ruff check .

    - name: Run Black formatter check
      working-directory: src/backend
      run: poetry run black --check .

    - name: Run isort import sort check
      working-directory: src/backend
      run: poetry run isort --check-only .

    - name: Run MyPy type checker
      working-directory: src/backend
      run: poetry run mypy . --ignore-missing-imports

    # - name: Run tests with pytest
    #   working-directory: src/backend
    #   run: poetry run pytest tests/ -v --cov=app --cov-report=xml

    # - name: Upload coverage to Codecov
    #   uses: codecov/codecov-action@v3
    #   with:
    #     file: src/backend/coverage.xml
    #     fail_ci_if_error: true

  # Frontend linting and testing
  frontend-quality:
    name: Frontend Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'yarn'
        cache-dependency-path: frontend/yarn.lock

    - name: Install dependencies
      working-directory: frontend
      run: yarn install --frozen-lockfile

    - name: Run ESLint
      working-directory: frontend
      run: yarn lint

    - name: Run Prettier check
      working-directory: frontend
      run: yarn format:check

    - name: Run TypeScript type check
      working-directory: frontend
      run: yarn type-check

    - name: Build project
      working-directory: frontend
      run: yarn build

    # - name: Run tests
    #   working-directory: frontend
    #   run: yarn test --coverage

  # Security scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Poetry
      uses: snok/install-poetry@v1

    - name: Install dependencies
      working-directory: src/backend
      run: poetry install --no-interaction

    - name: Run Bandit security scan
      working-directory: src/backend
      run: poetry run bandit -r app/ -f json -o bandit-report.json || true

    - name: Upload Bandit scan results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: bandit-security-scan
        path: src/backend/bandit-report.json

  # Docker build test
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build backend image
      uses: docker/build-push-action@v5
      with:
        context: ./src/backend
        push: false
        tags: lambda-backend:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: false
        tags: lambda-frontend:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Integration tests (run after builds pass)
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality, docker-build]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create test environment file
      run: |
        cat > .env << EOF
        DATABASE_URL=postgresql://admin:admin@db:5432/lambda_test_db
        CHROMA_HOST=chroma
        CHROMA_PORT=8000
        CELERY_BROKER_URL=redis://cache:6379/0
        CELERY_RESULT_BACKEND=redis://cache:6379/0
        EOF

    - name: Run integration tests with Docker Compose
      run: |
        # docker-compose -f docker-compose.yml -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from test
        echo "Integration tests would run here"

# Environment variables for all jobs
env:
  PYTHONPATH: src/backend
  NODE_ENV: test